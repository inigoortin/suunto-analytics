[project]
name = "suunto-analytics"
version = "0.1.0"
description = "Local analytics and MCP server for Suunto Race data"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fitdecode>=0.10",
    "mcp>=1.2",
    "keyring>=25.7.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
suunto = "suunto_analytics.cli:main"
suunto-mcp = "suunto_analytics.mcp.server:main"
suunto-app = "suunto_analytics.web.app:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suunto_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
